
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Home Experience AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #statusBanner {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 450px;
      padding: 14px;
      border-radius: 12px;
      background: #c0392b;
      color: white;
      text-align: center;
      font-weight: bold;
      z-index: 10;
    }

    #instructions {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      padding: 10px;
      background: rgba(0,0,0,0.75);
      color: white;
      text-align: center;
      border-radius: 10px;
      z-index: 10;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <!-- Status Banner -->
  <div id="statusBanner">
    Scan the Hiro Marker to Enter Your Smart Home
  </div>

  <div id="instructions">
    Tap the lamp to hide/show it. Tap the ball to change its colour.
  </div>

  <!-- AR Scene -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- 3D Model -->
    <a-assets>
      <a-asset-item
        id="plantModel"
        src="models/indoor-plant.glb">
      </a-asset-item>
    </a-assets>

    <!-- Hiro Marker -->
    <a-marker
      preset="hiro"
      id="hiroMarker">

      <!-- Smart Home Floor -->
      <a-box
        position="0 0.02 0"
        width="3"
        height="0.04"
        depth="3"
        color="#D6C6B2">
      </a-box>

      <!-- 3D Plant Model -->
      <a-entity
        gltf-model="#plantModel"
        position="1 0.05 -1"
        scale="0.5 0.5 0.5">
      </a-entity>

      <!-- SMART TV -->
      <a-box
        position="0 0.85 -1.15"
        width="1.5"
        height="0.85"
        depth="0.12"
        color="#222222">
      </a-box>

      <a-box
        position="0 0.85 -1.075"
        width="1.35"
        height="0.7"
        depth="0.015"
        color="#2980B9">
      </a-box>

      <a-text
        value="SMART TV"
        position="-0.4 1.35 -1.05"
        color="white"
        width="2">
      </a-text>

      <!-- SOFA -->
      <a-box
        position="0 0.3 0.55"
        width="1.5"
        height="0.4"
        depth="0.55"
        color="#8E44AD">
      </a-box>

      <a-box
        position="0 0.58 0.8"
        width="1.5"
        height="0.45"
        depth="0.15"
        color="#9B59B6">
      </a-box>

      <a-text
        value="SOFA"
        position="-0.25 0.9 0.8"
        color="white"
        width="2">
      </a-text>

      <!-- SMART LAMP -->
      <a-entity id="lamp" position="-1 0 -0.5" scale="0.5 0.5 0.5"> 
      <a-cylinder
        position="0 0.5 0"
        radius="0.08"
        height="1"
        color="#555">
      </a-cylinder>

      <a-sphere>
        position="0 1.1 0"
        radius="0.2"
        color="yellow"
        class="clickable"
        </a-sphere>
      </a-entity>

      <a-text
        value="TAP LAMP"
        position="0.5 1.5 0"
        color="white"
        width="2">
      </a-text>
      </a-entity>

      <!-- ROBOT VACUUM -->
      <a-cylinder
        position="0.8 0.15 0.2"
        radius="0.25"
        height="0.2"
        color="#34495E"
        animation="property: position;
          from: 0.8 0.15 0.2;
          to: -0.6 0.15 0.2;
          dur: 3000;
          dir: alternate;
          loop: true">
      </a-cylinder>

      <a-text
        value="ROBOT VACUUM"
        position="0.45 0.45 0.2"
        color="white"
        width="2">
      </a-text>

      
      <!-- CEILING FAN -->
      <a-entity
             position="0 1.8 0"
             animation="property: rotation;
             to: 0 360 0;
             loop: true;
             dur: 2000">

  <a-cylinder
    position="0 0 0"
    radius="0.08"
    height="0.15"
    color="#333">
  </a-cylinder>

  <a-box
    position="0.6 0 0"
    width="1.2"
    height="0.05"
    depth="0.2"
    color="#777">
  </a-box>

  <a-box
    position="-0.6 0 0"
    width="1.2"
    height="0.05"
    depth="0.2"
    color="#777">
  </a-box>

  <a-box
    position="0 0 0.4"
    width="0.15"
    height="0.05"
    depth="0.8"
    color="#3498DB">
  </a-box>

  <a-box
    position="0 0 -0.4"
    width="0.15"
    height="0.05"
    depth="0.8"
    color="#3498DB">
  </a-box>

</a-entity>

      <!-- INTERACTIVE BALL -->
      <a-sphere
        id="colorBall"
        class="clickable"
        position="1 0.35 -0.5"
        radius="0.2"
        color="red">
      </a-sphere>

      <a-text
        value="TAP BALL"
        position="0.7 0.65 -0.5"
        color="white"
        width="2">
      </a-text>

      <!-- EXTERNAL GLB MODEL -->
      <a-entity
        gltf-model="#plantModel"
        position="1 0 -1"
        scale="0.3 0.3 0.3">
      </a-entity>

      <a-text
        value="SMART HOME"
        position="-0.65 1.8 -1"
        color="#FFFFFF"
        width="3">
      </a-text>

    </a-marker>

    <!-- Camera and interaction cursor -->
    <a-entity camera>
      <a-entity
        cursor="rayOrigin: mouse; fuse: false"
        raycaster="objects: .clickable">
      </a-entity>
    </a-entity>

  </a-scene>

  

    <script>

  // Lamp ON/OFF
  const lamp = document.querySelector('#lamp');
  const lampSphere = lamp.querySelector('a-sphere');

  lampSphere.addEventListener('click', function () {
    const isVisible = lamp.getAttribute('visible');
    lamp.setAttribute('visible', !isVisible);
  });


  // Ball Colour Change
  const ball = document.querySelector('#colorBall');

  const colors = [
    'red',
    'blue',
    'green',
    'yellow',
    'purple'
  ];

  let colorIndex = 0;

  ball.addEventListener('click', function () {
    colorIndex = (colorIndex + 1) % colors.length;
    ball.setAttribute('color', colors[colorIndex]);
  });


  // Marker Found and Lost
  const marker = document.querySelector('#hiroMarker');
  const banner = document.querySelector('#statusBanner');

  marker.addEventListener('markerFound', function () {
    banner.innerText = 'Smart Home Activated!';
    banner.style.background = '#27AE60';
  });

  marker.addEventListener('markerLost', function () {
    banner.innerText =
      'Scan the Hiro Marker to Enter Your Smart Home';

    banner.style.background = '#C0392B';
  });

</script>
